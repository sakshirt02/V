<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine 💖</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: #ffe4ef;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* Prevents scrollbars if the button moves to the edge */
    }

    .card {
      background: white;
      width: 360px;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      z-index: 1;
    }

    h2 {
      color: #ff4d6d;
      margin-bottom: 25px;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      align-items: center;
    }

    button {
      padding: 12px 25px;
      border-radius: 30px;
      border: none;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
    }

    #noBtn {
      position: fixed; /* Necessary to move it anywhere on screen */
      background: #fbdae1;
      color: #ff4d6d;
      transition: all 0.2s ease;
      z-index: 999;
    }

    .yay {
      margin-top: 10px;
      font-size: 14px;
      display: none;
      color: #ff4d6d;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <div style="font-size:60px;">🐱</div>
    <h2>Diwi, will you be my Valentine forever??</h2>

    <div class="btn-container">
      <button id="yesBtn">Yesss</button>
      <button id="noBtn">Abbe hatttt</button>
    </div>

    <div class="yay" id="yayText">Yipppppieee!! 💖✨ mere cutie Mundu Bille
    Fass gyi tu... hahahahaha</div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const yayText = document.getElementById("yayText");
    const card = document.getElementById("mainCard");

    let yesSize = 18; // Initial font size

    noBtn.addEventListener("mouseover", () => {
      // 1. Calculate a random position
      // We subtract the button width/height so it doesn't go off-screen
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;

      // 2. Make the "Yes" button grow to be more tempting!
      yesSize += 5;
      yesBtn.style.fontSize = `${yesSize}px`;
      yesBtn.style.padding = `${yesSize/2}px ${yesSize}px`;
    });

    yesBtn.addEventListener("click", () => {
      yayText.style.display = "block";
      noBtn.style.display = "none";
      // Hide the question and the "Yes" button
      document.querySelector('h2').style.display = "none";
      yesBtn.style.display = "none";
    });
  </script>
</body>
</html>
