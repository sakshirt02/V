<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine 💖</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: #ffe4ef;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .card {
      background: white;
      width: 360px;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      z-index: 2;
    }

    h2 {
      margin-top: 15px;
    }

    button {
      padding: 12px 30px;
      border-radius: 30px;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
      margin-top: 15px;
    }

    #noBtn {
      position: fixed; /* 🔥 key for fullscreen */
      background: #eee;
      color: black;
      margin-top: 20px;
      transition: top 0.25s ease, left 0.25s ease;
    }

    .yay {
      margin-top: 15px;
      font-size: 20px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="card">
    <div style="font-size:40px;">😺 ❤️</div>
    <h2>Diwaker, will you be my Valentine?</h2>

    <button id="yesBtn">Yes</button>

    <div class="yay" id="yayText">YAY!! 🎉💖</div>
  </div>

  <button id="noBtn">No</button>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const yayText = document.getElementById("yayText");

    // Initial position of No button
    noBtn.style.left = "50%";
    noBtn.style.top = "70%";

    noBtn.addEventListener("mouseover", () => {
      const padding = 20;

      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;

      noBtn.style.left = randomX + "px";
      noBtn.style.top = randomY + "px";
    });

    yesBtn.addEventListener("click", () => {
      yayText.style.display = "block";
      noBtn.style.display = "none";
    });
  </script>

</body>
</html>
